<!DOCTYPE html>
<html>
    <head>
        <title> Silly Story </title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1> Silly Story </h1>

        <label for="noun"> Enter a noun: </label>
        <input type="text" id="noun">
        <br>
        <label for="verb"> Enter a verb (past tense): </label>
        <input type="text" id="verb">
        <br>
        <label for="adjective"> Enter an adjective: </label>
        <input type="text" id="adjective">
        <br>
        <label for="place"> Enter a place: </label>
        <input type="text" id="place">
        <br>
        <button onClick="playStory()"> Make Story </button>

        <p id="paragraph1"> Enter the 4 required inputs. </p>
        <p id="paragraph2"> Then press the button to make the story! </p>

        <script src="sillystory-DOM.js"></script>
    </body>
</html>
